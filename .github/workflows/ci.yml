name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.7.0
        with:
          python-version: "3.12"
      - name: Instalar ruff
        run: pipx install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  typecheck:
    name: Tipos (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.7.0
        with:
          python-version: "3.12"
      - name: Instalar uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Sincronizar entorno desde el lockfile
        run: uv sync --locked --extra dev
        env:
          UV_PYTHON_PREFERENCE: only-system
      - name: Mypy estricto
        run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.7.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Sincronizar entorno desde el lockfile
        run: uv sync --locked --extra dev
        env:
          UV_PYTHON_PREFERENCE: only-system
      - name: Pytest con cobertura
        run: uv run pytest --cov=regalias_vzla --cov-report=term-missing

  audit:
    name: Auditoría de dependencias (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.7.0
        with:
          python-version: "3.12"
      - name: Instalar uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Exportar dependencias del lockfile
        run: >
          uv export --frozen --all-extras --no-hashes --no-annotate --no-emit-project
          --format requirements-txt --output-file requirements-audit.txt
      - name: Escanear CVEs con pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit==2.10.1"
          pip-audit --strict -r requirements-audit.txt
