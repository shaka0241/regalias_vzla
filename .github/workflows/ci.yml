name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.7.0
        with:
          python-version: "3.12"
      - name: Instalar ruff
        run: pipx install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  typecheck:
    name: Tipos (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.7.0
        with:
          python-version: "3.12"
      - name: Instalar uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Sincronizar entorno desde el lockfile
        run: uv sync --locked --extra dev
        env:
          UV_PYTHON_PREFERENCE: only-system
      - name: Mypy estricto
        run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.7.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Sincronizar entorno desde el lockfile
        run: uv sync --locked --extra dev
        env:
          UV_PYTHON_PREFERENCE: only-system
      - name: Pytest con cobertura
        run: uv run pytest --cov=regalias_vzla --cov-report=term-missing

  audit:
    name: Auditoría de dependencias (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.7.0
        with:
          python-version: "3.12"
      - name: Instalar uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Exportar dependencias del lockfile
        run: >
          uv export --frozen --all-extras --no-hashes --no-annotate --no-emit-project
          --format requirements-txt --output-file requirements-audit.txt
      - name: Escanear CVEs con pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit==2.10.1"
          pip-audit --strict -r requirements-audit.txt
