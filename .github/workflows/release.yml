name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build y validación del paquete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar que el tag coincide con la versión del proyecto
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION_PYPROJECT=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          VERSION_CODIGO=$(python -c "import ast; arbol=ast.parse(open('src/regalias_vzla/__init__.py',encoding='utf-8').read()); print([n.value.value for n in ast.walk(arbol) if isinstance(n, ast.Assign) and any(getattr(t,'id',None)=='__version__' for t in n.targets)][0])")
          echo "tag=v$TAG pyproject=$VERSION_PYPROJECT codigo=$VERSION_CODIGO"
          if [ "$TAG" != "$VERSION_PYPROJECT" ] || [ "$TAG" != "$VERSION_CODIGO" ]; then
            echo "::error::El tag no coincide con la versión en pyproject.toml / __init__.py"
            exit 1
          fi
      - name: Instalar herramientas de build
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Construir sdist y wheel
        run: python -m build
      - name: Validar metadatos con twine
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke-test:
    name: Smoke test del wheel (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Instalar el wheel construido
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
          pip install pytest
      - name: Ejecutar la suite contra el paquete instalado
        run: pytest tests -q

  publish:
    name: Publicar en PyPI
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publicar con Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
